<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墨声 UI Review</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="review-shell">
      <aside class="review-rail" aria-label="评审控制台">
        <div>
          <p class="eyebrow">MOSHENG</p>
          <h1>墨声</h1>
          <p class="rail-copy">Codex UI review · 对齐 GitHub 当前 Windows 版</p>
        </div>

        <nav class="review-tabs" aria-label="UI states">
          <button class="review-tab active" type="button" data-view="settings">
            <span>01</span>
            设置窗口
          </button>
          <button class="review-tab" type="button" data-view="overlay">
            <span>02</span>
            输入胶囊
          </button>
          <button class="review-tab" type="button" data-view="flow">
            <span>03</span>
            输入流程
          </button>
        </nav>

        <section class="rail-card">
          <span>GitHub</span>
          <strong>Henry1025 / mosheng</strong>
        </section>

        <section class="rail-card">
          <span>当前快捷键</span>
          <strong id="shortcutSummary">长按左 Shift</strong>
        </section>
      </aside>

      <section class="review-stage">
        <section class="review-view active" data-panel="settings" aria-label="设置窗口">
          <div class="stage-caption">
            <p class="eyebrow">WINDOWS APP · SETTINGS</p>
            <h2>设置窗口</h2>
          </div>

          <article class="native-settings-window" aria-label="墨声设置窗口">
            <button class="window-close" type="button" aria-label="关闭">×</button>
            <p class="eyebrow brand-kicker">MOSHENG</p>
            <h3 class="brand-title">墨声</h3>
            <h4>语音输入设置</h4>
            <p class="helper">输入智谱 API Key 后，长按快捷键说话。</p>

            <label class="field-label" for="apiKeyInput">智谱 API Key</label>
            <div class="api-field saved" id="apiField">
              <input id="apiKeyInput" class="api-input" type="password" value="" aria-label="API Key" />
              <span class="api-saved-signal" aria-hidden="true">•••• •••• ••••  已保存</span>
            </div>

            <div class="save-row">
              <button class="primary-button saved" type="button" id="saveKeyButton">已保存</button>
            </div>

            <div class="shortcut-row">
              <div>
                <span class="field-label">长按说话，松开输入</span>
                <strong id="shortcutValue">长按左 Shift</strong>
              </div>
              <button class="shortcut-button" type="button" id="shortcutButton">更改</button>
            </div>
          </article>
        </section>

        <section class="review-view" data-panel="overlay" aria-label="输入胶囊">
          <div class="stage-caption">
            <p class="eyebrow">FLOATING INPUT</p>
            <h2>输入胶囊</h2>
          </div>

          <div class="state-switcher" role="tablist" aria-label="输入状态">
            <button class="state-chip active" type="button" data-overlay="recording">按住中</button>
            <button class="state-chip" type="button" data-overlay="processing">松开后消失</button>
            <button class="state-chip" type="button" data-overlay="success">已输入</button>
            <button class="state-chip" type="button" data-overlay="error">失败</button>
          </div>

          <div class="overlay-canvas">
            <div class="floating-capsule recording" id="floatingCapsule" aria-label="输入胶囊">
              <span class="waveform" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
              </span>
            </div>
          </div>
        </section>

        <section class="review-view" data-panel="flow" aria-label="输入流程">
          <div class="stage-caption">
            <p class="eyebrow">REAL INPUT FLOW</p>
            <h2>输入时的桌面状态</h2>
          </div>

          <div class="desktop-mock">
            <header>
              <span class="window-dot"></span>
              <strong>Notes</strong>
            </header>
            <textarea spellcheck="false">这里模拟当前 Windows 光标所在的应用。

1. 用户长按左 Shift。
2. 屏幕底部出现一个很小的黑色输入胶囊。
3. 松开后胶囊消失，后台识别并把文字粘贴到当前光标。</textarea>
            <div class="floating-capsule recording flow-capsule" aria-label="输入中胶囊">
              <span class="waveform" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
